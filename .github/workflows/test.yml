name: API自动化测试

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 代码语法检查
      run: |
        python -m py_compile api/client.py
        python -m py_compile api/auth_api.py
        python -m py_compile api/store_api.py
        python -m py_compile api/product_api.py
        python -m py_compile api/order_api.py
        python -m py_compile api/payment_api.py
        python -m py_compile api/member_api.py
        python -m py_compile config/config.py
        python -m py_compile conftest.py
        python -m py_compile utils/logger.py
        python -m py_compile utils/assertions.py
        python -m py_compile utils/helpers.py

    - name: 测试收集验证
      run: |
        pytest --collect-only -q
      env:
        TEST_ENV: test

    - name: 生成测试报告
      run: |
        pytest --collect-only --html=reports/test-collection.html --self-contained-html -q
      env:
        TEST_ENV: test

    - name: 上传测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: reports/*.html

    - name: 运行本地测试（仅在本地环境）
      if: github.event_name == 'workflow_dispatch'
      run: |
        pytest -v --html=reports/full-report.html --self-contained-html
      env:
        TEST_ENV: test
        TEST_ADMIN_PHONE: ${{ secrets.TEST_ADMIN_PHONE }}
        TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
